<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>粒子花火 · Magnetic Collider</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#0a0a0f;color:#eef2fb;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  /* 返回主集合按钮：与集合内其他游戏页一致 */
  .back-home{position:fixed;top:14px;left:14px;z-index:9999;
    display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;
    text-decoration:none;font-size:13px;color:#eef2fb;
    background:rgba(18,22,38,.62);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.14);}
  .back-home:hover{border-color:#b08bff;}
  .stage{max-width:800px;margin:54px auto 0;padding:0 14px;}
  canvas{display:block;width:100%;max-width:800px;height:auto;
    background:#0a0a0f;border:1px solid #20283c;border-radius:12px;
    touch-action:none;cursor:default;}
  .panel{max-width:800px;margin:14px auto 0;padding:0 14px;
    display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;}
  .ctrl{display:flex;align-items:center;gap:12px;flex:1;min-width:260px;}
  .ctrl label{font-size:13px;color:#9aa7c4;white-space:nowrap;}
  .ctrl #strVal{color:#eef2fb;font-weight:700;font-variant-numeric:tabular-nums;}
  input[type=range]{flex:1;accent-color:#b08bff;}
  .btns{display:flex;gap:10px;}
  .btn{font-size:14px;font-weight:600;color:#0a0a0f;background:#b08bff;border:none;
    padding:9px 16px;border-radius:10px;cursor:pointer;transition:filter .15s ease;}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;color:#eef2fb;border:1px solid #2c3650;font-weight:500;}
  .btn.ghost:hover{border-color:#b08bff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .status{max-width:800px;margin:14px auto 0;padding:10px 16px;border-radius:10px;
    background:rgba(255,255,255,.04);border:1px solid #20283c;
    font-size:14px;color:#9aa7c4;text-align:center;font-variant-numeric:tabular-nums;}
  .status.ok{color:#54d6a0;border-color:#2c5a45;}
  .status.bad{color:#ff6b6b;border-color:#5a2c2c;}
  .legend{max-width:800px;margin:14px auto 28px;padding:14px 16px;border-radius:10px;
    background:rgba(255,255,255,.03);border:1px solid #20283c;
    font-size:13px;color:#9aa7c4;line-height:1.7;}
  .legend b{color:#cdd6ea;}
  .legend .k{display:inline-block;width:11px;height:11px;border-radius:3px;
    vertical-align:-1px;margin:0 4px 0 10px;}
</style>
</head>
<body>
<a class="back-home" href="../index.html">← 游戏集合</a>

<div class="stage">
  <canvas id="game" width="800" height="460"></canvas>
</div>

<div class="panel">
  <div class="ctrl">
    <label>磁场强度 <span id="strVal">5.0</span></label>
    <input id="strength" type="range" min="-10" max="10" step="0.5" value="5.0">
  </div>
  <div class="btns">
    <button id="flip" class="btn ghost">翻转 N/S</button>
    <button id="pause" class="btn">暂停</button>
    <button id="reset" class="btn ghost">重置</button>
  </div>
</div>

<div id="status" class="status">自动脉冲发射中 · 拖拽磁极或调节强度，让粒子命中右侧靶标</div>

<div class="legend">
  <b>玩法</b>：你不能直接控制粒子，只能<b>设计磁场</b>。粒子从发射源<b>自动脉冲式</b>喷出；
  灰色虚线是下一发脉冲的预测轨迹（与实飞共用同一套物理，所见即所飞）。
  <b>磁场流线</b>：蓝=N 极向外、红=S 极向内，虚线流动方向即场方向。
  <span class="k" style="background:#4ea1ff"></span>N 极（逆时针偏转）
  <span class="k" style="background:#ff6b6b"></span>S 极（顺时针偏转）
  <span class="k" style="background:#54d6a0"></span>靶标
  <span class="k" style="background:#f87171"></span>粒子
</div>

<script>
"use strict";
// ===== 常量 =====
const W = 800, H = 460;
const DT = 0.08;          // 积分步长
const V0 = 4.5;           // 初速度（水平向右）
const STEPS = 350;        // 预测线积分步数
const MIN_D = 12;         // 磁场最小作用距离（防除零）
const OOB = 50;           // 出界缓冲 ±px
const POLE_R = 18;        // 磁极半径
const SRC = { x: 80, y: H / 2 };
const TGT = { x: W - 80, y: H / 2 };
const SRC_R = 14, TGT_R = 22;
const SUB = 5;            // 每帧积分步数
const PULSE_INTERVAL = 0.6; // 自动脉冲间隔（秒）
const MAX_PARTICLES = 60;   // 同屏脉冲上限

// ===== 状态 =====
let poles = [{ x: W / 2, y: 140, strength: 5.0 }];
let particles = [];       // 多粒子脉冲流（无寿命，仅出界/命中结束）
let running = true;       // 自动脉冲发射开关
let pulseTimer = 0;
let hitCount = 0;         // 累计命中脉冲数
let targetGlow = 0;       // 命中后靶标高亮衰减量 [0,1]
let simTime = 0;          // 磁场流线动画时钟
let dragging = null, dragOffset = { x: 0, y: 0 };
let lastT = 0;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const strengthEl = document.getElementById("strength");
const strVal = document.getElementById("strVal");
const pauseBtn = document.getElementById("pause");
const resetBtn = document.getElementById("reset");
const flipBtn = document.getElementById("flip");
const statusEl = document.getElementById("status");

// ===== 物理 =====
// 洛伦兹力：F = q(v × B)，q=m=1 → a = (B·vy, -B·vx)
function getBField(x, y) {
  let b = 0;
  for (const p of poles) {
    let dx = x - p.x, dy = y - p.y;
    let d = Math.hypot(dx, dy);
    if (d < MIN_D) d = MIN_D;          // 防除零
    b += p.strength / d;               // 径向衰减，带符号（N 正 / S 负）
  }
  return b;
}
// 单步欧拉积分（预测线与实飞共用，保证一致）
function integrateStep(st) {
  const B = getBField(st.x, st.y);
  const ax = B * st.vy, ay = -B * st.vx;
  st.vx += ax * DT;
  st.vy += ay * DT;
  st.x += st.vx * DT;
  st.y += st.vy * DT;
  return st;
}
// 预测线：从发射源出发跑 STEPS 步（与实飞同一积分器）
function computeTrajectory() {
  let st = { x: SRC.x, y: SRC.y, vx: V0, vy: 0 };
  const pts = [{ x: st.x, y: st.y }];
  for (let i = 0; i < STEPS; i++) {
    integrateStep(st);
    pts.push({ x: st.x, y: st.y });
    if (st.x < -OOB || st.x > W + OOB || st.y < -OOB || st.y > H + OOB) break;
  }
  return pts;
}
function hitTarget(p) { return Math.hypot(p.x - TGT.x, p.y - TGT.y) <= TGT_R; }
function outOfBounds(p) {
  return p.x < -OOB || p.x > W + OOB || p.y < -OOB || p.y > H + OOB;
}

// ===== 绘制 =====
function drawGrid() {
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}
// 磁场等高线（强度分层）
function drawField() {
  for (const p of poles) {
    const col = p.strength > 0 ? "78,161,255" : p.strength < 0 ? "255,107,107" : "150,150,150";
    for (let r = 30; r <= 260; r += 30) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(" + col + ",0.06)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}
// 磁场流线（新增视觉）：以磁极为中心的径向流线，虚线流动表方向
function drawFieldLines() {
  for (const p of poles) {
    const col = p.strength > 0 ? "78,161,255" : "255,107,107";
    const isN = p.strength >= 0;     // N 极向外、S 极向内
    const N = 18;
    const L = Math.hypot(W, H);      // 足够长，超出画布自动裁剪
    ctx.save();
    ctx.setLineDash([6, 10]);
    ctx.lineDashOffset = isN ? -((simTime * 36) % 16) : ((simTime * 36) % 16);
    ctx.lineWidth = 1.3;
    for (let i = 0; i < N; i++) {
      const ang = (i / N) * Math.PI * 2;
      const cx = Math.cos(ang), cy = Math.sin(ang);
      const r0 = POLE_R + 5;
      const x0 = p.x + cx * r0, y0 = p.y + cy * r0;
      const x1 = p.x + cx * (r0 + L), y1 = p.y + cy * (r0 + L);
      ctx.strokeStyle = "rgba(" + col + ",0.16)";
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      // 方向箭头（N 向外 / S 向内）
      const ax = p.x + cx * (r0 + 70), ay = p.y + cy * (r0 + 70);
      const aAng = isN ? ang : ang + Math.PI;
      ctx.fillStyle = "rgba(" + col + ",0.42)";
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - 6 * Math.cos(aAng - 0.4), ay - 6 * Math.sin(aAng - 0.4));
      ctx.lineTo(ax - 6 * Math.cos(aAng + 0.4), ay - 6 * Math.sin(aAng + 0.4));
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}
function drawTrajectory(pts) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = "rgba(200,210,230,0.55)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.setLineDash([]);
  // 末端箭头
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  ctx.fillStyle = "rgba(200,210,230,0.7)";
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - 8 * Math.cos(ang - 0.4), b.y - 8 * Math.sin(ang - 0.4));
  ctx.lineTo(b.x - 8 * Math.cos(ang + 0.4), b.y - 8 * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawSource() {
  ctx.strokeStyle = "#9aa7c4";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(SRC.x, SRC.y, SRC_R, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = "#9aa7c4";
  ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText("发射源", SRC.x, SRC.y - SRC_R - 6);
}
function drawTarget() {
  const glow = targetGlow;
  ctx.strokeStyle = glow > 0 ? "#7CFFB0" : "#54d6a0";
  ctx.lineWidth = glow > 0 ? 3 : 2;
  ctx.beginPath(); ctx.arc(TGT.x, TGT.y, TGT_R, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(TGT.x - TGT_R, TGT.y); ctx.lineTo(TGT.x + TGT_R, TGT.y);
  ctx.moveTo(TGT.x, TGT.y - TGT_R); ctx.lineTo(TGT.x, TGT.y + TGT_R);
  ctx.stroke();
  if (glow > 0) {
    ctx.fillStyle = "rgba(84,214,160," + (0.1 + 0.3 * glow).toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(TGT.x, TGT.y, TGT_R, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = "#54d6a0";
  ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText("靶标", TGT.x, TGT.y + TGT_R + 14);
}
function drawPole() {
  for (const p of poles) {
    const col = p.strength > 0 ? "#4ea1ff" : p.strength < 0 ? "#ff6b6b" : "#888";
    const label = p.strength > 0 ? "N" : p.strength < 0 ? "S" : "0";
    if (dragging === p) {
      ctx.beginPath(); ctx.arc(p.x, p.y, POLE_R + 6, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, POLE_R, 0, Math.PI * 2);
    ctx.globalAlpha = 0.92; ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = "#0a0a0f";
    ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(label, p.x, p.y);
  }
}
function drawParticles() {
  for (const p of particles) {
    // 尾迹
    ctx.strokeStyle = "rgba(248,113,113,0.35)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < p.trail.length; i++) {
      const t = p.trail[i];
      if (i === 0) ctx.moveTo(t.x, t.y); else ctx.lineTo(t.x, t.y);
    }
    ctx.stroke();
    // 本体 4px + 8px 速度方向线
    ctx.fillStyle = "#f87171";
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    const sp = Math.hypot(p.vx, p.vy) || 1;
    ctx.strokeStyle = "#fca5a5"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + p.vx / sp * 8, p.y + p.vy / sp * 8);
    ctx.stroke();
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0a0a0f"; ctx.fillRect(0, 0, W, H);
  drawGrid();
  drawField();
  drawFieldLines();                            // 磁场流线
  drawTrajectory(computeTrajectory());        // 预测线：始终显示（下一发脉冲路径）
  drawSource();
  drawTarget();
  drawPole();
  drawParticles();
}

// ===== 主循环 =====
function loop(ts) {
  const dt = lastT ? Math.min(0.05, (ts - lastT) / 1000) : 0.016;
  lastT = ts;
  simTime += dt;
  // 自动脉冲发射
  if (running) {
    pulseTimer += dt;
    if (pulseTimer >= PULSE_INTERVAL) {
      pulseTimer -= PULSE_INTERVAL;
      if (particles.length < MAX_PARTICLES)
        particles.push({ x: SRC.x, y: SRC.y, vx: V0, vy: 0, trail: [] });
    }
  }
  // 实飞更新（无寿命，仅出界/命中结束）
  for (let k = particles.length - 1; k >= 0; k--) {
    const p = particles[k];
    for (let i = 0; i < SUB; i++) {
      integrateStep(p);
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 200) p.trail.shift();
      if (hitTarget(p)) {
        hitCount++; targetGlow = 1;
        setStatus("命中靶标！累计 " + hitCount + " 次脉冲", true);
        particles.splice(k, 1); break;
      }
      if (outOfBounds(p)) { particles.splice(k, 1); break; }
    }
  }
  if (targetGlow > 0) targetGlow = Math.max(0, targetGlow - dt * 1.6);
  draw();
  requestAnimationFrame(loop);
}

// ===== 交互 =====
function evtPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
function onDown(e) {
  const p = evtPos(e);
  for (const pole of poles) {
    if (Math.hypot(p.x - pole.x, p.y - pole.y) <= POLE_R) {
      dragging = pole;
      dragOffset = { x: p.x - pole.x, y: p.y - pole.y };
      canvas.style.cursor = "grabbing";
      break;
    }
  }
}
function onMove(e) {
  const p = evtPos(e);
  if (dragging) {
    dragging.x = Math.max(30, Math.min(W - 30, p.x - dragOffset.x));
    dragging.y = Math.max(30, Math.min(H - 30, p.y - dragOffset.y));
  } else {
    const hover = poles.some(pole => Math.hypot(p.x - pole.x, p.y - pole.y) <= POLE_R);
    canvas.style.cursor = hover ? "grab" : "default";
  }
}
function onUp() { dragging = null; canvas.style.cursor = "default"; }

canvas.addEventListener("pointerdown", onDown);
canvas.addEventListener("pointermove", onMove);
window.addEventListener("pointerup", onUp);

strengthEl.addEventListener("input", () => {
  const v = parseFloat(strengthEl.value);
  poles[0].strength = v;
  strVal.textContent = v.toFixed(1);
});
flipBtn.addEventListener("click", () => {
  const v = -poles[0].strength;
  poles[0].strength = v;
  strengthEl.value = v;
  strVal.textContent = v.toFixed(1);
});
pauseBtn.addEventListener("click", () => {
  running = !running;
  pauseBtn.textContent = running ? "暂停" : "继续";
  setStatus(running ? "自动脉冲发射中 · 累计命中 " + hitCount + " 次" : "已暂停", null);
});
resetBtn.addEventListener("click", () => {
  poles = [{ x: W / 2, y: 140, strength: 5.0 }];
  strengthEl.value = 5.0; strVal.textContent = "5.0";
  particles = []; hitCount = 0; targetGlow = 0; pulseTimer = 0; running = true;
  pauseBtn.textContent = "暂停";
  setStatus("自动脉冲发射中 · 拖拽磁极或调节强度，让粒子命中右侧靶标", null);
});

function setStatus(t, ok) {
  statusEl.textContent = t;
  statusEl.className = "status" + (ok === true ? " ok" : ok === false ? " bad" : "");
}

requestAnimationFrame(loop);
</script>
</body>
</html>
